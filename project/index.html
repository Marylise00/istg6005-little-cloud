<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Track your ingredients, cook what you have, and waste less with Pantry Rescue.">
  <title>Pantry Rescue</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.mjs"></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#overview"><span class="brand-icon" data-icon="leaf"></span><span>Pantry Rescue</span></a>
    <nav aria-label="Main navigation">
      <a href="#overview" data-view="overview"><span data-icon="grid"></span>Overview</a>
      <a href="#inventory" data-view="inventory"><span data-icon="box"></span>My Pantry</a>
      <a href="#recipes" data-view="recipes"><span data-icon="book"></span>Recipes</a>
      <a href="#shopping" data-view="shopping"><span data-icon="cart"></span>Shopping List</a>
    </nav>
    <a class="sidebar-note" href="#urgent"><span data-icon="clock"></span><strong>Expiration alerts</strong><p>Review food that needs attention.</p></a>
  </aside>
  <main>
    <header class="topbar"><span id="breadcrumb">Kitchen overview</span><button class="button primary" data-action="add"><span data-icon="plus"></span>Add ingredient</button></header>
    <div id="content"></div>
  </main>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <div id="notice" role="status" aria-live="polite"></div>
</body>
</html>
